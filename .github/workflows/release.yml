name: Release

# Push a tag like `v0.2.0` to build installers for macOS, Windows and Linux
# and publish them on the GitHub release page (also feeds the in-app updater).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public Spotify Client ID baked into the build (repo → Settings → Variables).
          MAIN_VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          # No paid certificates: skip keychain lookup; mac uses ad-hoc signing from electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: false
