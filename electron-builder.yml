appId: dev.uhub.app
productName: U-Hub
copyright: Copyright © 2026 Lucas Farias
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # Tray icons are loaded at runtime via `?asset` paths that point into resources/.
  - resources/tray*.png
# Release artifacts get stable, arch-tagged names so the GitHub release page is readable.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  # No paid Apple certificate: ad-hoc sign ("-") so Apple Silicon will launch the app.
  # Users still need to approve it once (see README → "Instalando").
  identity: '-'
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [x64, arm64]
    # zip produces latest-mac.yml, which the in-app updater reads to detect new versions.
    - target: zip
      arch: [x64, arm64]

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  shortcutName: U-Hub
  artifactName: ${productName}-${version}-win-setup.${ext}

linux:
  icon: resources/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]

publish:
  provider: github
  owner: lcfarias1501
  repo: u-hub
  releaseType: release
